<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Today's plan</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="wrap">
      <div id="tabs"></div>
      <div id="capture"></div>
      <header class="top">
        <h1>Today</h1>
        <p class="sub" id="tlDate"></p>
      </header>

      <!-- SOMETHING'S COME UP. One tap to say the day has been taken over, one
           to say you're back — and the plan rebuilds around what's actually left. -->
      <div id="awayBar" class="away-bar"></div>

      <p id="tlStatus" class="status" hidden></p>

      <!-- THE PLAN: already built when you get here. Adjust it, then accept it. -->
      <div id="timeline"></div>
      <div id="dpAccept" class="dp-accept" hidden></div>
      <section id="unplanned" class="dp-also" hidden></section>

      <!-- TIME OFF. Not for the day itself — you can simply not open this — but
           so the planner knows the gap is coming and places the work around it.
           Five weeks to a deadline is not five weeks if five days are a break. -->
      <section class="setup-wrap">
        <details class="p-setup" id="offBox">
          <summary>Book time off</summary>
          <p class="muted">Days you won't be doing anything — away, resting, busy
            with something else. Nothing gets planned into them, and everything
            else moves to fit around them. Telling it early is the whole point.</p>
          <div class="ls-row">
            <label>From
              <input id="offFrom" type="date" />
            </label>
            <label>To
              <input id="offTo" type="date" />
            </label>
            <label>What to call it
              <input id="offLabel" type="text" maxlength="60" placeholder="away" />
            </label>
          </div>
          <div class="ls-actions">
            <button id="offAdd" type="button" class="btn">Mark those off</button>
            <button id="offToday" type="button" class="link">just today</button>
          </div>
          <p id="offWords" class="muted"></p>
          <div id="offList"></div>
        </details>
      </section>

      <!-- THE WEEK'S SHAPE: a once-a-term job, folded away the rest of the time -->
      <section class="setup-wrap">
        <button type="button" id="setupToggle" class="link setup-toggle">set up my week</button>
        <div id="setup" class="setup" hidden></div>
      </section>
    </main>

    <script src="nav.js" defer></script>
    <script src="voice.js" defer></script>
    <script src="store.js" defer></script>
    <script src="schedule.js" defer></script>
    <script src="dayshape.js" defer></script>
    <script src="rota.js" defer></script>
    <script src="ics.js" defer></script>
    <script src="priority.js" defer></script>
    <script src="dayplan.js" defer></script>
    <script src="weekplan.js" defer></script>
    <script src="weekend.js" defer></script>
    <script src="areas.js" defer></script>
    <script src="names.js" defer></script>
    <script src="quickparse.js" defer></script>
    <script src="capture.js" defer></script>
    <script src="timeline.js" defer></script>
  </body>
</html>
